app = 'jarvis-whatsapp-engine'
primary_region = 'nrt'

[build]

[env]
  PORT = '3009'
  PHONE_NUMBER = '254702894309'
  RESPOND_TO_GROUPS = 'false'
  JARVIS_PERSONA = 'Mohammed Abbas'

[http_service]
  internal_port = 3009
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
